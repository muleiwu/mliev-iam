{{define "navbar"}}
<style>
    .navbar-glass {
        background: rgba(15, 23, 42, 0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding: 1rem 0;
        transition: all 0.3s ease;
    }

    .navbar-brand {
        font-size: 1.5rem;
        background: linear-gradient(to right, #fff, #cbd5e1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .nav-link {
        font-weight: 500;
        color: rgba(255, 255, 255, 0.7) !important;
        transition: color 0.3s ease;
    }

    .nav-link:hover,
    .nav-link.active {
        color: white !important;
    }

    .btn-nav {
        border-radius: 50px;
        padding: 0.5rem 1.5rem;
        font-weight: 600;
    }

    @media (max-width: 991.98px) {
        .navbar-collapse {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 1rem;
            border-radius: 1rem;
            margin-top: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .navbar-nav .nav-link {
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .navbar-nav .nav-item:last-child .nav-link {
            border-bottom: none;
        }

        .d-flex.gap-2 {
            flex-direction: column;
            margin-top: 1rem;
        }

        .btn-nav {
            width: 100%;
            text-align: center;
        }
    }
</style>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top navbar-glass">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            <i class="fas fa-shield-alt me-2 text-primary"></i>Mliev IAM
        </a>

        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto ms-lg-4">
                <li class="nav-item">
                    <a class="nav-link active" href="/">首页</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#features">功能特性</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#security">安全认证</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#scenarios">应用场景</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#advantages">技术优势</a>
                </li>
            </ul>

            <div class="d-flex gap-2">
                <a href="/admin" class="btn btn-outline-light btn-nav btn-sm">
                    <i class="fas fa-cog me-1"></i>控制台
                </a>
                <a href="/api/docs" class="btn btn-primary btn-nav btn-sm">
                    <i class="fas fa-book me-1"></i>文档
                </a>
            </div>
        </div>
    </div>
</nav>
{{end}}
