{{define "layout"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>{{.Title}} - MLiev IAM</title>
    <meta name="description" content="MLiev IAM 提供基于 OIDC、OAuth2 等标准协议的统一身份认证解决方案，助力企业构建安全的访问控制体系，实现用户身份的集中化管理。">
    <link rel="icon" href="/static/images/home/mark.svg" type="image/svg+xml">
    <link rel="preload" href="/static/webfonts/iam-puhuiti-bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preload" href="/static/images/home/hero.webp" as="image" fetchpriority="high">
</head>
<body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    {{template "navbar" .}}
    <main id="main-content" tabindex="-1">
        {{block "content" .}}{{end}}
    </main>
    {{template "footer" .}}
    <script src="/static/js/main.js" defer></script>
</body>
</html>
{{end}}
